packages:
  - apps/*
  - packages/*

# Versions shared by several packages. Reference them as "catalog:" in package.json.
catalog:
  "@nestjs/cli": 11.0.24
  "@nestjs/common": 11.2.8
  "@nestjs/config": 4.0.4
  "@nestjs/core": 11.2.8
  "@nestjs/platform-express": 11.2.8
  "@nestjs/platform-ws": 11.2.8
  "@nestjs/schematics": 11.1.0
  "@nestjs/terminus": 11.1.1
  "@nestjs/testing": 11.2.8
  "@nestjs/websockets": 11.2.8
  "@swc/cli": 0.8.2
  "@swc/core": 1.16.22
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/ws": 8.18.2
  concurrently: 10.0.7
  esbuild: 0.28.2
  happy-dom: 21.0.4
  nestjs-pino: 5.3.1
  nestjs-zod: 5.6.0
  pino: 10.4.0
  pino-http: 11.0.0
  pino-pretty: 13.2.0
  react: 19.3.1
  react-dom: 19.3.1
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  tsdown: 0.23.7
  tsx: 4.23.15
  typescript: 7.0.2
  unplugin-swc: 2.0.0
  vitest: 5.1.0
  ws: 8.22.2
  zod: 4.6.7
  zustand: 5.1.0

# The Nest CLI (gateway, game) needs TypeScript's compiler API, which TypeScript 7.0 doesn't ship
# (it returns in 7.1). The services stay on TypeScript 6 until then.
catalogs:
  nest:
    typescript: 6.0.3

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  "@swc/core": true
  esbuild: true
  lefthook: true

overrides:
  # GHSA-q7qp-rjg7-q26m: Nest 11's platform-express pins multer 2.4.0. Drop this once a Nest 11
  # release depends on multer 2.5.0 or later.
  multer: 2.5.0
